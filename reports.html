<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirSentry - Reports</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Shared Styles */
        :root { --primary: #8ab4f8; --text-color: #e8eaed; --bg-color: #1a1a1c; --card-bg: #2d2e30; --border-color: #3c4043; --shadow-color: rgba(0, 0, 0, 0.4); }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        .navbar { /* ... same navbar styles ... */ background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 10px 20px; box-shadow: 0 1px 5px var(--shadow-color); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.6rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .nav-links a { color: #bdc1c6; text-decoration: none; padding: 10px 15px; font-size: 0.95rem; }
        .nav-links a.active { color: var(--primary); border-bottom: 2px solid var(--primary); }

        /* Page Specific Layout */
        .page-container { max-width: 1200px; margin: 25px auto; padding: 0 25px; }
        h1 { color: var(--primary); margin-bottom: 20px; font-size: 2rem; }
        .report-section { background-color: var(--card-bg); border-radius: 10px; padding: 25px; box-shadow: 0 4px 15px var(--shadow-color); margin-bottom: 30px; }
        .controls-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
        .controls-grid select, .controls-grid input, .controls-grid button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background-color: var(--bg-color); color: var(--text-color); }
        .controls-grid button { background-color: #4CAF50; color: white; cursor: pointer; border: none; }
        .report-list { list-style: none; padding: 0; }
        .report-list li { padding: 15px; border-bottom: 1px dashed var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .report-list li:hover { background-color: #3c4043; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="navbar">
        <div style="display: flex; align-items: center; gap: 20px;">
            <div class="logo"><i class="fas fa-cloud"></i>AirSentry</div>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="analytics.html">Analytics</a>
                <a href="maps.html">Maps</a>
                <a href="reports.html" class="active">Reports</a>
                <a href="alerts.html">Alerts</a>
                <a href="admin.html">Admin</a>
            </div>
        </div>
        <div><i class="fas fa-user-circle" style="color: #bdc1c6;"></i></div>
    </div>
    <div class="page-container">
        <h1><i class="fas fa-file-alt"></i> Report Generation Center</h1>

        <div class="report-section">
            <h3 style="color: #ff9f0a; margin-bottom: 15px;">Generate Custom Report</h3>
            <div class="controls-grid">
                <select>
                    <option>Select Location</option>
                    <option>Delhi</option><option>Mumbai</option>
                </select>
                <select>
                    <option>Select Report Type</option>
                    <option>Weekly AQI Summary</option><option>Pollutant Maxima</option>
                </select>
                <input type="date" value="2025-09-01">
                <input type="date" value="2025-09-30">
            </div>
            <div style="text-align: right;"><button onclick="alert('Report will be generated and emailed shortly.')"><i class="fas fa-chart-pie"></i> Generate & Download</button></div>
        </div>

        <div class="report-section">
            <h3 style="color: #8ab4f8; margin-bottom: 15px;">Scheduled Reports</h3>
            <ul class="report-list">
                <li>
                    <span><i class="fas fa-calendar-check"></i> Monthly Compliance (Delhi)</span>
                    <span>Status: Auto-sent | Next: 01 Nov 2025</span>
                    <button style="background: none; color: #ff9f0a; border: none; cursor: pointer;">Edit</button>
                </li>
                 <li>
                    <span><i class="fas fa-clock"></i> Weekly Trend (Mumbai)</span>
                    <span>Status: Active | Next: 20 Oct 2025</span>
                    <button style="background: none; color: #ff9f0a; border: none; cursor: pointer;">Edit</button>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
